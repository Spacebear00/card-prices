<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src https: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'">
<title>Card prices — MTG</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0e13;color:#e6ecf2;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:720px;margin:0 auto;padding:14px 14px 48px}
h1{margin:0 0 2px;font-size:19px}
.sub{font-size:12.5px;color:#55677a;margin-bottom:14px}
/* Two boxes, both big enough to hit with a thumb while holding a card in the other hand. */
.ask{display:flex;gap:8px}
.ask label{flex:1;display:flex;flex-direction:column;gap:4px}
.ask .cap{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#55677a}
input{height:52px;border-radius:10px;border:1px solid #2a3646;background:#0f141c;color:#e6ecf2;
  padding:0 12px;font-size:18px;font-family:ui-monospace,Menlo,monospace;width:100%}
input:focus{outline:none;border-color:#45c8b8}
#setbox{text-transform:uppercase}
.hits{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.hit{border:1px solid #2a3646;background:#0f141c;color:#8496a8;border-radius:999px;
  padding:7px 12px;font-size:13px;cursor:pointer;min-height:36px}
.hit b{color:#e6ecf2;font-weight:600}
.hit:hover{border-color:#45c8b8}
.state{margin-top:16px;color:#8496a8;font-size:14px}
.card{margin-top:16px;background:#0f141c;border:1px solid #1b2430;border-radius:14px;overflow:hidden}
.card .top{display:flex;gap:12px;padding:12px}
.card img{width:104px;flex:none;border-radius:8px;background:#11161f}
.card .who{flex:1;min-width:0}
.card .nm{font-size:17px;line-height:1.2}
.card .meta{font-size:12.5px;color:#8496a8;margin-top:4px;display:flex;gap:6px;flex-wrap:wrap}
.tag{border:1px solid #2a3646;border-radius:5px;padding:0 5px}
.prices{border-top:1px solid #1b2430;display:flex;flex-wrap:wrap}
.pr{flex:1 1 140px;padding:11px 12px;border-right:1px solid #1b2430}
.pr:last-child{border-right:0}
.pr .fin{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#55677a}
/* The number is the whole point, so it is the biggest thing on the screen. */
.pr .big{font-size:25px;font-family:ui-monospace,Menlo,monospace;color:#d9b45b;margin-top:2px}
.pr .alt{font-size:11.5px;color:#55677a;font-family:ui-monospace,Menlo,monospace}
.pr .none{font-size:15px;color:#55677a}
/* Keeping a card: one button on the result, and the list it goes into. */
.keep{display:block;width:100%;border:0;border-top:1px solid #1b2430;background:#121a24;
  color:#45c8b8;font:inherit;font-size:15px;padding:14px;cursor:pointer;min-height:50px}
.keep:hover{background:#16202c}
.keep.in{color:#cd7266}
.recent{margin-top:24px}
.rhead{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.rhead .cap{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#55677a}
.rhead .tot{font-family:ui-monospace,Menlo,monospace;color:#d9b45b;font-size:15px}
.rhead select{height:38px;border-radius:9px;border:1px solid #2a3646;background:#0f141c;
  color:#e6ecf2;padding:0 8px;font-size:14px;margin-left:auto}
.rrow{display:flex;gap:10px;align-items:center;padding:10px 2px;border-bottom:1px solid #161d27;
  font-size:14px}
.rrow .who{flex:1;min-width:0;cursor:pointer}
.rrow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .no{font-family:ui-monospace,Menlo,monospace;color:#55677a;font-size:12px}
.rrow .val{font-family:ui-monospace,Menlo,monospace;color:#d9b45b;flex:none}
/* A thumb-sized target, because the list is read standing up. */
.rrow .drop{flex:none;width:44px;height:44px;border:0;background:none;color:#55677a;
  font-size:18px;cursor:pointer;border-radius:8px}
.rrow .drop:hover{color:#cd7266;background:#161d27}
.rfoot{display:flex;gap:8px;margin-top:10px}
.rfoot button{border:1px solid #2a3646;background:#0f141c;color:#8496a8;border-radius:9px;
  padding:10px 14px;font:inherit;font-size:13px;cursor:pointer;min-height:42px}
.rfoot button:hover{color:#e6ecf2}
footer{color:#3e4c5a;font-size:11.5px;margin-top:26px;text-align:center}
</style></head>
<body><div class="wrap">
<h1>Card prices — MTG</h1>
<div class="sub" id="sub">Type a set code and the collector number off the card.</div>

<div class="ask">
  <label style="flex:0 0 40%">
    <span class="cap">Set</span>
    <input id="setbox" type="text" inputmode="text" autocomplete="off" autocapitalize="characters"
           spellcheck="false" placeholder="MH2" enterkeyhint="next">
  </label>
  <label>
    <span class="cap">Number</span>
    <input id="nobox" type="text" inputmode="numeric" autocomplete="off" spellcheck="false"
           placeholder="138" enterkeyhint="search">
  </label>
</div>
<div class="hits" id="hits"></div>

<div class="state" id="state"></div>
<div id="out"></div>

<div class="recent" id="recentBox" hidden>
  <div class="rhead">
    <span class="cap">Kept</span>
    <span class="tot" id="keptTotal"></span>
    <select id="keptSort" aria-label="Order the kept list">
      <option value="added">Order added</option>
      <option value="name">Name</option>
      <option value="set">Set, then number</option>
      <option value="high">Most valuable first</option>
      <option value="low">Least valuable first</option>
    </select>
  </div>
  <div id="recent"></div>
  <div class="rfoot">
    <button type="button" id="keptCopy">Copy as a list</button>
    <button type="button" id="keptClear">Clear</button>
  </div>
</div>

<footer id="foot"></footer>
</div>
<script>
var BASE = "p";
var INDEX = null;       // every set, loaded once
var SET = null;         // the set currently in hand
var recent = [];

var setbox = document.getElementById('setbox');
var nobox = document.getElementById('nobox');
var hits = document.getElementById('hits');
var state = document.getElementById('state');
var out = document.getElementById('out');

function money(cents) {
  if (cents === null || cents === undefined) return null;
  return '$' + (cents / 100).toFixed(2);
}
function say(text) { state.textContent = text || ''; }

/* The index is small and everything depends on it, so it is fetched once up front and
   the boxes stay disabled for the moment that takes rather than silently matching
   nothing. */
function loadIndex() {
  say('Loading the set list…');
  return fetch(BASE + '/sets.json').then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then(function (data) {
    INDEX = data.sets.map(function (row) {
      return { code: row[0], name: row[1], game: row[2], released: row[3],
               cards: row[4], slug: row[5] };
    });
    document.getElementById('foot').textContent =
      INDEX.length + ' sets · prices as of ' + String(data.built).slice(0, 10);
    say('');
  }).catch(function (error) {
    say('Could not load the set list (' + error.message + '). Reload the page.');
  });
}

/** Sets matching what has been typed: code first, then name. */
function matches(typed) {
  var want = typed.trim().toLowerCase();
  if (!want || !INDEX) return [];
  var byCode = [], byName = [];
  for (var i = 0; i < INDEX.length; i++) {
    var s = INDEX[i];
    var code = s.code.toLowerCase();
    if (code === want) return [s];
    if (code.indexOf(want) === 0) byCode.push(s);
    else if (s.name.toLowerCase().indexOf(want) >= 0) byName.push(s);
  }
  return byCode.concat(byName).slice(0, 6);
}

function paintHits() {
  hits.textContent = '';
  if (SET && SET.code.toLowerCase() === setbox.value.trim().toLowerCase()) return;
  var found = matches(setbox.value);
  for (var i = 0; i < found.length; i++) {
    (function (s) {
      var b = document.createElement('button');
      b.className = 'hit';
      b.type = 'button';
      b.innerHTML = '<b>' + s.code + '</b> ' + s.name.replace(/[<>&]/g, '');
      b.onclick = function () { setbox.value = s.code; paintHits(); pick(s.code); nobox.focus(); };
      hits.appendChild(b);
    })(found[i]);
  }
}

/** Fetch one set's prices. Cached by the browser, so asking twice costs nothing. */
function pick(code) {
  var want = String(code).trim().toUpperCase();
  if (!want) return Promise.resolve(null);
  if (SET && SET.code.toUpperCase() === want) return Promise.resolve(SET);
  /* By SLUG, from the index — a set code can carry a colon or an ampersand, which is not
     a file name, so the writer slugged it and the index carries what it chose. */
  var known = null;
  for (var i = 0; INDEX && i < INDEX.length; i++) {
    if (INDEX[i].code.toUpperCase() === want) { known = INDEX[i]; break; }
  }
  if (!known) { SET = null; say('No set called ' + want + '.'); return Promise.resolve(null); }
  say('Reading ' + known.code + '…');
  return fetch(BASE + '/' + encodeURIComponent(known.slug) + '.json').then(function (r) {
    if (!r.ok) throw new Error(r.status === 404 ? 'no prices for ' + want : 'HTTP ' + r.status);
    return r.json();
  }).then(function (data) {
    SET = { code: data.code, name: data.name, by: {} };
    for (var i = 0; i < data.cards.length; i++) {
      var row = data.cards[i];
      // Indexed by the number as printed AND without leading zeros, because '004' and
      // '4' are the same card read off the same corner.
      var key = String(row[0]).toLowerCase();
      SET.by[key] = row;
      var bare = key.replace(/^0+(?=.)/, '');
      if (!(bare in SET.by)) SET.by[bare] = row;
    }
    say('');
    return SET;
  }).catch(function (error) {
    SET = null;
    say(String(error.message));
    return null;
  });
}

function show(row) {
  out.textContent = '';
  if (!row) return;
  var card = document.createElement('div');
  card.className = 'card';

  var top = document.createElement('div');
  top.className = 'top';
  if (row[4]) {
    var img = document.createElement('img');
    img.src = row[4];
    img.alt = row[1];
    img.loading = 'lazy';
    top.appendChild(img);
  }
  var who = document.createElement('div');
  who.className = 'who';
  var nm = document.createElement('div');
  nm.className = 'nm';
  nm.textContent = row[1];
  who.appendChild(nm);
  var meta = document.createElement('div');
  meta.className = 'meta';
  function tag(text) {
    if (!text) return;
    var t = document.createElement('span');
    t.className = 'tag';
    t.textContent = text;
    meta.appendChild(t);
  }
  tag(SET.code + ' ' + row[0]);
  tag(row[3]);
  tag(row[2]);
  who.appendChild(meta);
  top.appendChild(who);
  card.appendChild(top);

  var prices = document.createElement('div');
  prices.className = 'prices';
  var finishes = Object.keys(row[5] || {});
  if (!finishes.length) {
    var none = document.createElement('div');
    none.className = 'pr';
    none.innerHTML = '<div class="fin">Price</div><div class="none">none downloaded</div>';
    prices.appendChild(none);
  }
  for (var i = 0; i < finishes.length; i++) {
    var finish = finishes[i];
    var pair = row[5][finish];
    var low = money(pair[0]), market = money(pair[1]);
    var box = document.createElement('div');
    box.className = 'pr';
    var head = document.createElement('div');
    head.className = 'fin';
    head.textContent = finish;
    box.appendChild(head);
    var big = document.createElement('div');
    // Low is what the owner's own sale sheets quote, so it leads where there is one.
    big.className = low || market ? 'big' : 'none';
    big.textContent = low || market || 'no price';
    box.appendChild(big);
    if (low && market) {
      var alt = document.createElement('div');
      alt.className = 'alt';
      alt.textContent = 'market ' + market;
      box.appendChild(alt);
    }
    prices.appendChild(box);
  }
  card.appendChild(prices);

  var keepBtn = document.createElement('button');
  keepBtn.id = 'keepBtn';
  keepBtn.type = 'button';
  keepBtn.dataset.no = row[0];
  keepBtn.onclick = function () { keep(SET.code, row); markKeep(); };
  card.appendChild(keepBtn);

  out.appendChild(card);
  markKeep();
}

/**
 * The kept list.
 *
 * Added on purpose rather than by looking something up, because the list is a pile being
 * worked through and a card you checked and put back does not belong in it. It survives
 * the browser closing, which a list built up over an evening at a table has to.
 */
function loadKept() {
  try {
    var saved = JSON.parse(localStorage.getItem('grimoire.lookup.kept') || '[]');
    if (Object.prototype.toString.call(saved) === '[object Array]') recent = saved;
  } catch (e) { /* a browser with no storage still keeps the list for this visit */ }
}
function saveKept() {
  try { localStorage.setItem('grimoire.lookup.kept', JSON.stringify(recent)); } catch (e) {}
}

/** What one copy is worth: the first finish with a price, low before market. */
function worth(entry) {
  var pair = entry.prices || {};
  var keys = Object.keys(pair);
  for (var i = 0; i < keys.length; i++) {
    var p = pair[keys[i]];
    if (p[0] !== null && p[0] !== undefined) return p[0];
    if (p[1] !== null && p[1] !== undefined) return p[1];
  }
  return null;
}

function heldAt(code, no) {
  for (var i = 0; i < recent.length; i++) {
    if (recent[i].code === code && String(recent[i].no) === String(no)) return i;
  }
  return -1;
}

function keep(code, row) {
  var at = heldAt(code, row[0]);
  if (at >= 0) recent.splice(at, 1);
  else recent.push({ code: code, no: row[0], name: row[1], prices: row[5] || {} });
  saveKept();
  paintKept();
  return at < 0;
}

var SORTS = {
  added: null,
  name: function (a, b) { return a.name.localeCompare(b.name); },
  set: function (a, b) {
    return a.code.localeCompare(b.code)
      || String(a.no).localeCompare(String(b.no), undefined, { numeric: true });
  },
  high: function (a, b) { return (worth(b) || 0) - (worth(a) || 0); },
  low: function (a, b) { return (worth(a) || 0) - (worth(b) || 0); },
};

function paintKept() {
  var box = document.getElementById('recent');
  box.textContent = '';
  var how = document.getElementById('keptSort').value;
  // 'Order added' is the list as it stands; the others never reorder what is stored.
  var list = SORTS[how] ? recent.slice().sort(SORTS[how]) : recent.slice();

  var total = 0, priced = 0;
  for (var i = 0; i < recent.length; i++) {
    var w = worth(recent[i]);
    if (w !== null) { total += w; priced++; }
  }
  document.getElementById('keptTotal').textContent = recent.length
    ? recent.length + (recent.length === 1 ? ' card · ' : ' cards · ') + money(total)
      + (priced < recent.length ? ' (' + (recent.length - priced) + ' with no price)' : '')
    : '';

  for (var k = 0; k < list.length; k++) {
    (function (entry) {
      var line = document.createElement('div');
      line.className = 'rrow';

      var who = document.createElement('div');
      who.className = 'who';
      var nm = document.createElement('div');
      nm.className = 'nm';
      nm.textContent = entry.name;
      var no = document.createElement('div');
      no.className = 'no';
      no.textContent = entry.code + ' ' + entry.no;
      who.appendChild(nm); who.appendChild(no);
      // Tapping the card itself looks it up again, which is how you check one twice.
      who.onclick = function () { setbox.value = entry.code; nobox.value = entry.no; look(); };

      var val = document.createElement('span');
      val.className = 'val';
      var w = worth(entry);
      val.textContent = w === null ? '—' : money(w);

      var drop = document.createElement('button');
      drop.className = 'drop';
      drop.type = 'button';
      drop.title = 'Take ' + entry.name + ' off the list';
      drop.textContent = '\u00d7';
      drop.onclick = function () {
        var at = heldAt(entry.code, entry.no);
        if (at >= 0) { recent.splice(at, 1); saveKept(); paintKept(); markKeep(); }
      };

      line.appendChild(who); line.appendChild(val); line.appendChild(drop);
      box.appendChild(line);
    })(list[k]);
  }
  document.getElementById('recentBox').hidden = recent.length === 0;
}

/** The button on the open card says whether that card is already on the list. */
function markKeep() {
  var button = document.getElementById('keepBtn');
  if (!button || !SET) return;
  var on = heldAt(SET.code, button.dataset.no) >= 0;
  button.textContent = on ? '\u2212  Take off the list' : '+  Keep for review';
  button.className = 'keep' + (on ? ' in' : '');
}

function look() {
  var number = nobox.value.trim().toLowerCase();
  if (!number) { out.textContent = ''; return; }
  pick(setbox.value).then(function (set) {
    if (!set) { out.textContent = ''; return; }
    var row = set.by[number] || set.by[number.replace(/^0+(?=.)/, '')];
    if (!row) {
      out.textContent = '';
      say('No card ' + number + ' in ' + set.code + '.');
      return;
    }
    say('');
    show(row);
  });
}

setbox.addEventListener('input', paintHits);
setbox.addEventListener('change', function () { pick(setbox.value).then(function () { if (nobox.value) look(); }); });
setbox.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); nobox.focus(); } });
nobox.addEventListener('input', look);
nobox.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); nobox.blur(); } });

document.getElementById('keptSort').onchange = paintKept;
document.getElementById('keptClear').onclick = function () {
  if (!recent.length) return;
  if (!confirm('Take all ' + recent.length + ' off the list?')) return;
  recent = [];
  saveKept();
  paintKept();
  markKeep();
};
/* Out of the phone and into a message or a spreadsheet, in the same shape the rest of
   Grimoire reads: a count, a name, and the set and number in brackets. */
document.getElementById('keptCopy').onclick = function () {
  var how = document.getElementById('keptSort').value;
  var list = SORTS[how] ? recent.slice().sort(SORTS[how]) : recent.slice();
  var text = list.map(function (e) {
    var w = worth(e);
    return '1 ' + e.name + ' (' + e.code + ') ' + e.no + (w === null ? '' : '  ' + money(w));
  }).join('\n');
  var done = document.getElementById('keptCopy');
  function said(what) { done.textContent = what; setTimeout(function () { done.textContent = 'Copy as a list'; }, 1600); }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () { said('Copied'); },
                                             function () { said('Could not copy'); });
  } else { said('Could not copy'); }
};

loadKept();
paintKept();

loadIndex().then(function () {
  // Straight back to where you were: a venue is one set at a time.
  try {
    var last = localStorage.getItem('grimoire.lookup.set');
    if (last) { setbox.value = last; pick(last); }
  } catch (e) { /* a browser with no storage still works */ }
  setbox.focus();
});
setbox.addEventListener('change', function () {
  try { localStorage.setItem('grimoire.lookup.set', setbox.value.trim().toUpperCase()); } catch (e) {}
});
</script>
</body></html>
